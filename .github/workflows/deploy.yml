name: Deploy to VPS

on:
  push:
    branches: [master]

jobs:
  deploy-crm:
    name: Deploy CRM (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if frontend/ changed
        id: crm_changed
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          elif git diff --name-only "$BEFORE" HEAD | grep -q '^frontend/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi


      - name: Set up Node
        if: steps.crm_changed.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          # Alinhado ao runtime de producao (frontend/Dockerfile: node:20-alpine).
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.crm_changed.outputs.changed == 'true'
        working-directory: frontend
        run: npm ci

      - name: TypeScript type-check
        if: steps.crm_changed.outputs.changed == 'true'
        working-directory: frontend
        run: npm run type-check

      # Gate bloqueante: qualquer teste vermelho impede o deploy.
      - name: Run frontend tests
        if: steps.crm_changed.outputs.changed == 'true'
        working-directory: frontend
        run: npm run test

      - name: Next.js build validation
        if: steps.crm_changed.outputs.changed == 'true'
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_FASTAPI_URL: http://placeholder.api.local
        run: npm run build

      - name: Deploy CRM via SSH
        if: steps.crm_changed.outputs.changed == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GH_TOKEN
          script_stop: true
          script: |
            set -e
            cd "/srv/Maquinadevendascanastra"
            rm -f .git/index.lock
            git config --global --add safe.directory "/srv/Maquinadevendascanastra"
            # Repo agora é privado: fetch anônimo via HTTPS falha com exit 128.
            # Autentica o fetch com o GITHUB_TOKEN efêmero do job (Contents: read).
            git fetch --prune -f "https://x-access-token:${GH_TOKEN}@github.com/Kmzf777/maquina-de-vendas.git" master
            git clean -fd
            git reset --hard FETCH_HEAD

            if [ -f "frontend/.env.build" ]; then source frontend/.env.build; elif [ -f "crm/.env.build" ]; then source crm/.env.build; cp crm/.env.build frontend/.env.build || true; else echo ".env.build not found!"; exit 1; fi
            sg docker -c "docker build \
              --build-arg NEXT_PUBLIC_FASTAPI_URL=$NEXT_PUBLIC_FASTAPI_URL \
              --build-arg NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL \
              --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY \
              -t canastra-crm:latest ./frontend"
            sg docker -c "docker stack deploy -c frontend/docker-compose.yml crm"
            sg docker -c "docker service update \
              --env-add SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY \
              crm_crm"
            sg docker -c "docker service update --force crm_crm"
            echo "CRM deployed successfully"

  deploy-backend:
    name: Deploy Backend (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if backend/ changed
        id: backend_changed
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          elif git diff --name-only "$BEFORE" HEAD | grep -q '^backend/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.backend_changed.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          # Alinhado ao runtime de producao (backend/Dockerfile: python:3.12-slim).
          python-version: '3.12'

      - name: Install backend dependencies
        if: steps.backend_changed.outputs.changed == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run backend smoke checks
        if: steps.backend_changed.outputs.changed == 'true'
        working-directory: backend
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_KEY: ci-dummy-supabase-service-key
        run: |
          python -m compileall app
          python -c "from app.config import Settings; Settings(); print('settings-ok')"

      # Gate bloqueante: qualquer teste vermelho impede o deploy.
      # -m "not integration": exclui testes que exigem Supabase real (pytest.ini).
      - name: Run backend tests
        if: steps.backend_changed.outputs.changed == 'true'
        working-directory: backend
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_KEY: ci-dummy-supabase-service-key
        run: python -m pytest -q -m "not integration" -p no:cacheprovider

      - name: Deploy Backend via SSH
        if: steps.backend_changed.outputs.changed == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GH_TOKEN
          script_stop: true
          script: |
            set -e
            cd "/srv/Maquinadevendascanastra"
            git config --global --add safe.directory "/srv/Maquinadevendascanastra"
            # Repo agora é privado: fetch anônimo via HTTPS falha com exit 128.
            # Autentica o fetch com o GITHUB_TOKEN efêmero do job (Contents: read).
            git fetch --prune -f "https://x-access-token:${GH_TOKEN}@github.com/Kmzf777/maquina-de-vendas.git" master
            git reset --hard FETCH_HEAD
            sg docker -c "docker build -t canastra-api:latest ./backend"
            sg docker -c "docker stack deploy -c backend/docker-compose.yml canastra"
            sg docker -c "docker service update --force canastra_api"
            sg docker -c "docker service update --force canastra_worker"
            echo "Backend deployed successfully"
