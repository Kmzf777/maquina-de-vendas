services:
  api:
    # Para `docker stack deploy`: comente `build` e use a imagem pré-construída.
    # Para `docker compose up -d` com Traefik em swarmMode=false: mantenha build.
    build: .
    image: canastra-api:latest
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - redis
    restart: unless-stopped
    # Intervalos conservadores (VPS única): 30s + start_period cobre boot sem drenar CPU.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - canastrainteligencia
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=canastrainteligencia"
        - "traefik.http.routers.meubackend.rule=Host(`api.canastrainteligencia.com`)"
        - "traefik.http.routers.meubackend.entrypoints=websecure"
        - "traefik.http.routers.meubackend.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.meubackend.loadbalancer.server.port=8000"

  worker:
    build: .
    image: canastra-api:latest
    command: python -m app.campaign.worker
    env_file: .env
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - canastrainteligencia

  redis:
    image: redis:7-alpine
    command: redis-server /etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./redis.conf:/etc/redis/redis.conf:ro
    restart: unless-stopped
    # PING autenticado: extrai o requirepass do conf montado (sem senha no compose).
    healthcheck:
      test: ["CMD-SHELL", "P=$$(sed -n 's/^requirepass //p' /etc/redis/redis.conf); if [ -n \"$$P\" ]; then redis-cli -a \"$$P\" --no-auth-warning ping; else redis-cli ping; fi | grep -q PONG"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - canastrainteligencia

networks:
  canastrainteligencia:
    external: true

volumes:
  redis_data:
