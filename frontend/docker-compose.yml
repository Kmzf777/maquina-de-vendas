services:
  crm:
    image: canastra-crm:latest
    # Variáveis de runtime (SUPABASE_SERVICE_ROLE_KEY, lida pelas rotas de servidor) vêm do
    # .env.build da VPS (fora do git), no MESMO `docker stack deploy`. Antes elas entravam num
    # `docker service update --env-add` separado, e o stack deploy apagava a variável: em
    # 12/11/2026 o SSH do CI caiu entre os dois passos e o CRM ficou 10 min com 500 em toda rota
    # de servidor ("supabaseKey is required"). Sem o arquivo, o deploy falha em vez de subir sem chave.
    env_file: .env.build
    networks:
      - canastrainteligencia
    # wget busybox da imagem alpine; /login é página pública barata.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 0
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=canastrainteligencia"

        # Router — subdomínio crm
        - "traefik.http.routers.frontend.rule=Host(`crm.canastrainteligencia.com`)"
        - "traefik.http.routers.frontend.entrypoints=websecure"
        - "traefik.http.routers.frontend.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.frontend.loadbalancer.server.port=3000"

networks:
  canastrainteligencia:
    external: true
